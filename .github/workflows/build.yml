name: Build Windows EXE

# Builds VoicePitch.exe on a Windows runner and uploads it as a downloadable
# artifact.  Runs automatically on every push, and can be triggered manually
# from the Actions tab ("Run workflow").

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pitch-accuracy checks (stdlib-only)
        run: python tests/run_core_tests.py

      - name: Run pytest suite
        run: pytest -q
        continue-on-error: true

      - name: Build standalone executable
        run: pyinstaller --noconfirm VoicePitch.spec

      - name: Upload VoicePitch.exe
        uses: actions/upload-artifact@v4
        with:
          name: VoicePitch-windows
          path: dist/VoicePitch.exe
          if-no-files-found: error
